name: Daily XAUUSD Bias

"on":
  schedule:
    # ~11:17 WIB, sedikit setelah candle Daily baru terbentuk di New York
    # (00:00 New York = ~11:00 WIB saat DST AS aktif; geser ke menit :17
    # untuk menghindari antrian jadwal GitHub di menit :00)
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bias calculator
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python bias_calculator.py

      - name: Commit bias.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bias.json
          git diff --staged --quiet || git commit -m "Update daily XAUUSD bias"
          git push
          
